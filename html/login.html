<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Last Hope</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandViolet: '#7B2CF5',
            brandDarkViolet: '#4B139B',
          }
        }
      }
    }
  </script>
  <style>
    /* Effet verre dépoli iOS (Glassmorphism) */
    .ios-glass {
      background: rgba(25, 16, 38, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ios-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .input-glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .input-glass:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(123, 44, 245, 0.5);
      outline: none;
    }
    /* Animation d'entrée */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-slide-up {
      animation: slideUp 0.6s ease-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-brandDarkViolet via-black to-[#120822] text-white min-h-screen flex items-center justify-center font-sans antialiased selection:bg-brandViolet selection:text-white">

  <!-- Blob background decoration -->
  <div class="fixed top-0 left-0 w-96 h-96 bg-brandViolet/10 rounded-full filter blur-3xl -z-10"></div>
  <div class="fixed bottom-0 right-0 w-96 h-96 bg-brandDarkViolet/10 rounded-full filter blur-3xl -z-10"></div>

  <!-- Login Container -->
  <div class="w-full max-w-md px-6 animate-slide-up">
    
    <!-- Logo Section -->
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <img src="../Last_Hope.png" alt="Logo Last Hope" class="w-16 h-16 rounded-2xl shadow-lg shadow-brandViolet/30 object-cover">
      </div>
      <h1 class="text-3xl font-bold tracking-tight">Last Hope</h1>
      <p class="text-gray-400 mt-2">Tableau de bord intelligent</p>
    </div>

    <!-- Login Form Card -->
    <div class="ios-glass p-8 rounded-3xl space-y-6">
      
      <div>
        <h2 class="text-2xl font-semibold mb-1">Connexion</h2>
        <p class="text-sm text-gray-400">Accédez à votre compte</p>
      </div>

      <!-- Form -->
      <form class="space-y-4" id="loginForm">
        
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium mb-2 text-gray-300">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="votre@email.com" 
            class="input-glass w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 transition"
            required
          >
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium mb-2 text-gray-300">Mot de passe</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            class="input-glass w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 transition"
            required
          >
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer group">
            <input type="checkbox" name="remember" class="w-4 h-4 rounded cursor-pointer accent-brandViolet">
            <span class="text-gray-400 group-hover:text-gray-300 transition">Se souvenir de moi</span>
          </label>
          <a href="#" class="text-brandViolet hover:text-brandViolet/80 transition font-medium">Mot de passe oublié ?</a>
        </div>

        <!-- Login Button -->
        <button 
          type="submit" 
          class="w-full bg-gradient-to-r from-brandViolet to-brandDarkViolet px-4 py-3 rounded-xl text-sm font-semibold shadow-lg shadow-brandViolet/30 hover:opacity-90 transition active:scale-95"
        >
          Se connecter
        </button>

      </form>
    </div>

  </div>

  <!-- Client API d'authentification -->
  <script src="auth-client.js"></script>

  <!-- JavaScript -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.querySelector('button[type="submit"]');
      
      // Validation simple
      if (!email || !password) {
        alert('Veuillez remplir tous les champs');
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert('Veuillez entrer une adresse email valide');
        return;
      }

      try {
        // Désactivation du bouton pendant la connexion
        loginBtn.disabled = true;
        loginBtn.textContent = 'Connexion en cours...';

        // Appel à l'API
        const result = await auth.login(email, password);

        // Succès
        alert(`Bienvenue ${result.user.prenom || result.user.email}!`);
        
        // Redirection vers le dashboard
        window.location.href = 'index.html';
        
      } catch (error) {
        // Gestion des erreurs
        console.error('Erreur de connexion:', error);
        alert('Erreur: ' + error.message);
        
        // Réactivation du bouton
        loginBtn.disabled = false;
        loginBtn.textContent = 'Se connecter';
      }
    });

    // Vérification si l'utilisateur est déjà connecté
    window.addEventListener('load', function() {
      if (auth.isAuthenticated()) {
        // Redirection automatique si déjà connecté
        window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
